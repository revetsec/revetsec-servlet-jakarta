          rm -rf ~/.m2/repository/com/revetsec
          mvn -B -ntp -f core/pom.xml -DskipTests -Dmaven.javadoc.skip=true install
          mvn -B -ntp -f adapter/pom.xml -Dmaven.javadoc.skip=true package
      - name: Compile paired M12 cookbook sources
        run: |
          mvn -B -ntp -f core/examples/postgresql-pending-store/pom.xml -Dmaven.test.skip=true package
          servlet_api_jar="$HOME/.m2/repository/jakarta/servlet/jakarta.servlet-api/6.1.0/jakarta.servlet-api-6.1.0.jar"
          example_jar="core/examples/postgresql-pending-store/target/postgresql-pending-store-1.0.0-SNAPSHOT.jar"
          test -f "$servlet_api_jar"
          test -f "$example_jar"
          mkdir -p "$RUNNER_TEMP/m12-recipes"
          "$JAVA_HOME/bin/javac" --release 17 -proc:none -Xlint:all -Werror \
            -cp "core/target/revetsec-1.0.0-SNAPSHOT.jar:adapter/target/revetsec-servlet-jakarta-1.0.0-SNAPSHOT.jar:$servlet_api_jar:$example_jar" \
            -d "$RUNNER_TEMP/m12-recipes" \
            adapter/docs/ServletWorkflowRecipes.java adapter/docs/ServletDurableBackendRecipe.java
      - name: Download the reviewed Servlet runtime
        run: |
          url=$(python3 -c 'import json; print(json.load(open("adapter/verification/m12-container/runtime.json"))["url"])')
          curl --fail --location --proto '=https' --tlsv1.2 "$url" --output "$RUNNER_TEMP/tomcat.tar.gz"
      - name: Qualify M12 workflows in Tomcat
        run: >-
          python3 adapter/verification/m12-container/run.py
          --tomcat-archive "$RUNNER_TEMP/tomcat.tar.gz"
          --core-jar core/target/revetsec-1.0.0-SNAPSHOT.jar
          --adapter-jar adapter/target/revetsec-servlet-jakarta-1.0.0-SNAPSHOT.jar
          --java-home "$JAVA_HOME"
          --output "$RUNNER_TEMP/m12-container-evidence"
      - name: Upload redacted container receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m12-servlet-jakarta-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m12-container-evidence/RESULT.json
          if-no-files-found: error
          retention-days: 14

  saml-container:
