          ref: ${{ env.REVETSEC_CORE_SHA }}
          path: core
          persist-credentials: false
      - name: Set up Corretto 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: corretto
          java-version: '21'
          cache: maven
      - name: Build pinned core and adapter
        run: |
          rm -rf ~/.m2/repository/com/revetsec
          mvn -B -ntp -f core/pom.xml -DskipTests -Dmaven.javadoc.skip=true install
          mvn -B -ntp -f adapter/pom.xml -Dmaven.javadoc.skip=true package
      - name: Download the reviewed Servlet runtime
        run: |
          url=$(python3 -c 'import json; print(json.load(open("adapter/verification/saml-container/runtime.json"))["url"])')
          curl --fail --location --proto '=https' --tlsv1.2 "$url" --output "$RUNNER_TEMP/tomcat.tar.gz"
      - name: Qualify signed SAML POST logout in Tomcat
        run: >-
          python3 adapter/verification/saml-container/run.py
          --tomcat-archive "$RUNNER_TEMP/tomcat.tar.gz"
          --core-jar core/target/revetsec-1.0.0-SNAPSHOT.jar
          --adapter-jar adapter/target/revetsec-servlet-jakarta-1.0.0-SNAPSHOT.jar
          --java-home "$JAVA_HOME"
          --output "$RUNNER_TEMP/saml-container-evidence"
      - name: Upload redacted container receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: saml-servlet-jakarta-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/saml-container-evidence/RESULT.json
          if-no-files-found: error
          retention-days: 14

  totp-container:
